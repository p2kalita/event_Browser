<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f0;
    color: #1a1a1a;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Top bar ─────────────────────────────────────── */
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; color: #111; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .last-updated { font-size: 13px; color: #666; }

  .btn-refresh {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #333;
    transition: background 0.15s;
  }
  .btn-refresh:hover { background: #f5f5f5; }
  .btn-refresh svg { width: 14px; height: 14px; }
  .btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main content ────────────────────────────────── */
  .container { padding: 24px; max-width: 1300px; margin: 0 auto; }

  /* ── Summary cards ───────────────────────────────── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: #fff;
    border: 1px solid #e4e4e4;
    border-radius: 10px;
    padding: 18px 20px;
  }
  .summary-card .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }
  .summary-card .count {
    font-size: 32px;
    font-weight: 600;
    line-height: 1;
  }
  .count.critical { color: #c0392b; }
  .count.error    { color: #d68910; }
  .count.warning  { color: #7d6608; }
  .count.info     { color: #1a6fad; }

  /* ── Toolbar ─────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-group { display: flex; gap: 0; }
  .filter-btn {
    padding: 6px 16px;
    border: 1px solid #ccc;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #444;
    transition: background 0.12s, color 0.12s;
  }
  .filter-btn:first-child { border-radius: 20px 0 0 20px; }
  .filter-btn:last-child  { border-radius: 0 20px 20px 0; border-left: none; }
  .filter-btn:not(:first-child):not(:last-child) { border-left: none; }
  .filter-btn.active {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
    z-index: 1;
  }
  .filter-btn:hover:not(.active) { background: #f5f5f5; }

  .search-box {
    flex: 1;
    max-width: 340px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #1a1a1a;
  }
  .search-box:focus { border-color: #888; }
  .search-box::placeholder { color: #aaa; }

  .invoice-select {
    min-width: 180px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #1a1a1a;
  }
  .invoice-select:focus { border-color: #888; }

  /* ── Table ───────────────────────────────────────── */
  .table-wrap {
    background: #fff;
    border: 1px solid #e4e4e4;
    border-radius: 10px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead tr {
    background: #fafafa;
    border-bottom: 1px solid #e8e8e8;
  }
  th {
    padding: 11px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #888;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  td {
    padding: 13px 16px;
    vertical-align: middle;
    font-size: 13px;
    color: #222;
  }

  /* ── Stage pill ──────────────────────────────────── */
  .stage-pill {
    font-size: 12px;
    color: #555;
    background: #f2f2f2;
    border-radius: 4px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  /* ── Severity badge ──────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-INFO     { background: #e8f4fd; color: #1a6fad; border: 1px solid #b8d9f2; }
  .badge-WARNING  { background: #fef9e7; color: #7d6608; border: 1px solid #f5e17a; }
  .badge-ERROR    { background: #fef2f2; color: #b03a2e; border: 1px solid #f5b7b1; }
  .badge-CRITICAL { background: #f9ebea; color: #922b21; border: 1px solid #f1948a; font-weight: 700; }

  /* ── Timestamp ───────────────────────────────────── */
  .ts { color: #555; font-size: 13px; white-space: nowrap; }

  /* ── Extra truncated ─────────────────────────────── */
  .extra {
    color: #888;
    font-size: 12px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "SF Mono", "Fira Code", monospace;
  }

  /* ── Validate button ─────────────────────────────── */
  .btn-details {
    padding: 5px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: #333;
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .btn-details:hover { background: #f5f5f5; border-color: #aaa; }
  .btn-details:active { transform: scale(0.97); }
  .btn-details.viewed { color:#1a6fad; border-color:#b8d9f2; background:#e8f4fd; }

  /* ── Empty state ─────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: 14px;
  }

  /* ── Detail modal ────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 540px;
    max-width: 95vw;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    border-bottom: 1px solid #efefef;
  }
  .modal-header h2 { font-size: 15px; font-weight: 600; }
  .modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: #888; line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { color: #222; }
  .modal-body { padding: 20px 22px; }
  .modal-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .modal-row .k {
    min-width: 110px;
    color: #888;
    font-weight: 500;
    flex-shrink: 0;
  }
  .modal-row .v { color: #111; word-break: break-all; }
  .modal-payload {
    background: #f7f7f7;
    border-radius: 6px;
    padding: 12px;
    font-size: 12px;
    font-family: "SF Mono","Fira Code", monospace;
    color: #333;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 8px;
    border: 1px solid #ebebeb;
  }

  /* ── Responsive ──────────────────────────────────── */
  @media (max-width: 768px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    th:nth-child(5), td:nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>Event Monitor</h1>
  <div class="topbar-right">
    <span class="last-updated" id="last-updated">Updated —</span>
    <button class="btn-refresh" id="btn-refresh" onclick="refresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Refresh
    </button>
  </div>
</div>

<!-- Main content -->
<div class="container">

  <!-- Summary cards -->
  <div class="summary-grid">
    <div class="summary-card">
      <div class="label">Critical</div>
      <div class="count critical" id="cnt-critical">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Error</div>
      <div class="count error" id="cnt-error">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Warning</div>
      <div class="count warning" id="cnt-warning">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Info</div>
      <div class="count info" id="cnt-info">0</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" data-filter="CRITICAL" onclick="setFilter('CRITICAL', this)">Critical</button>
      <button class="filter-btn" data-filter="ERROR" onclick="setFilter('ERROR', this)">Error</button>
      <button class="filter-btn" data-filter="WARNING" onclick="setFilter('WARNING', this)">Warning</button>
      <button class="filter-btn" data-filter="INFO" onclick="setFilter('INFO', this)">Info</button>
    </div>
    <select class="invoice-select" id="invoice-filter" onchange="renderTable()">
      <option value="all">All invoices</option>
    </select>
    <input class="search-box" id="search" placeholder="Search event description..."
           oninput="renderTable()"/>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Stage</th>
          <th>Invoice</th>
          <th>Event Message</th>
          <th>Severity</th>
          <th>Timestamp</th>
          <th>Extra</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Event Detail</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* ── Inline fallback data (overridden by events_data.js if loaded) ── */
if (!window.EVENTS_DATA) {
  window.EVENTS_DATA = [
    { id:"evt_a1b2c3d4", type:"COMPLETENESS_PASSED",    severity:"INFO",     timestamp:"2026-06-12T15:31:14.000Z", payload:{invoice_id:"INV-2024-101"} },
    { id:"evt_b2c3d4e5", type:"OCR_HIGH_CONFIDENCE",    severity:"INFO",     timestamp:"2026-06-12T15:31:14.010Z", payload:{invoice_id:"INV-2024-101"} },
    { id:"evt_c3d4e5f6", type:"VENDOR_VALIDATED",       severity:"INFO",     timestamp:"2026-06-12T15:31:14.020Z", payload:{invoice_id:"INV-2024-101", vendor_id:"V001"} },
    { id:"evt_d4e5f6g7", type:"PO_MATCHED",             severity:"INFO",     timestamp:"2026-06-12T15:31:14.030Z", payload:{invoice_id:"INV-2024-101", po_number:"PO-2024-55"} },
    { id:"evt_e5f6g7h8", type:"GRN_MATCHED",            severity:"INFO",     timestamp:"2026-06-12T15:31:14.040Z", payload:{invoice_id:"INV-2024-101"} },
    { id:"evt_f6g7h8i9", type:"TAX_VALID",              severity:"INFO",     timestamp:"2026-06-12T15:31:14.050Z", payload:{invoice_id:"INV-2024-101"} },
    { id:"evt_g7h8i9j0", type:"AI_AUTO_APPROVED",       severity:"INFO",     timestamp:"2026-06-12T15:31:14.060Z", payload:{invoice_id:"INV-2024-101"} },
    { id:"evt_h8i9j0k1", type:"OCR_LOW_CONFIDENCE",     severity:"WARNING",  timestamp:"2026-06-12T15:31:14.070Z", payload:{invoice_id:"INV-2024-202", low_confidence_fields:[{field:"total_amount",score:0.61}], threshold:0.85} },
    { id:"evt_i9j0k1l2", type:"TAX_MISMATCH",           severity:"WARNING",  timestamp:"2026-06-12T15:31:14.080Z", payload:{invoice_id:"INV-2024-202", stated:100, calculated:2700, difference:2600} },
    { id:"evt_j0k1l2m3", type:"AI_CLARIFICATION_NEEDED",severity:"WARNING",  timestamp:"2026-06-12T15:31:14.090Z", payload:{invoice_id:"INV-2024-202"} },
    { id:"evt_k1l2m3n4", type:"VENDOR_BLACKLISTED",     severity:"CRITICAL", timestamp:"2026-06-12T15:31:14.100Z", payload:{invoice_id:"INV-2024-303", vendor_id:"V999"} },
    { id:"evt_l2m3n4o5", type:"PIPELINE_ABORTED",       severity:"CRITICAL", timestamp:"2026-06-12T15:31:14.110Z", payload:{invoice_id:"INV-2024-303", aborted_at:"Vendor Validation"} },
    { id:"evt_m3n4o5p6", type:"COMPLETENESS_FAILED",    severity:"ERROR",    timestamp:"2026-06-12T15:31:14.120Z", payload:{invoice_id:"INV-2024-404", missing_fields:["total_amount","due_date"]} },
  ];
}

/* ── Helpers ── */
const RESOLVED_TYPES = new Set([
  "COMPLETENESS_PASSED","OCR_HIGH_CONFIDENCE","VENDOR_VALIDATED",
  "PO_MATCHED","GRN_MATCHED","TAX_VALID","DUPLICATE_NOT_FOUND",
  "AI_AUTO_APPROVED","PIPELINE_COMPLETED","VALIDATION_COMPLETED",
]);

function stageFromEvent(event) {
  if (event.payload && event.payload.stage) return event.payload.stage;

  const type = event.type || "";
  const map = {
    COMPLETENESS:    "Invoice Completeness",
    OCR:             "OCR Confidence",
    VENDOR:          "Vendor Validation",
    PO:              "PO Matching",
    GRN:             "GRN Matching",
    TAX:             "Tax Validation",
    DUPLICATE:       "Duplicate Detection",
    AI:              "AI Clarification",
    PIPELINE:        "Pipeline",
    VALIDATION:      "Pipeline",
  };
  for (const [k, v] of Object.entries(map)) {
    if (type.startsWith(k)) return v;
  }
  return type;
}

function extraFromPayload(payload) {
  const ignore = new Set(["invoice_id","pipeline","context_keys","stage"]);
  const parts  = Object.entries(payload)
    .filter(([k]) => !ignore.has(k))
    .map(([k, v]) => {
      const val = typeof v === "object" ? JSON.stringify(v) : v;
      return `${k}=${val}`;
    });
  return parts.join(", ") || "—";
}

function fmtTimestamp(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-GB", {
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hour12: false
    }).replace(",", "");
  } catch { return iso; }
}

function invoiceIdFromEvent(event) {
  return event.payload && event.payload.invoice_id ? event.payload.invoice_id : "N/A";
}

function titleCaseType(type) {
  return (type || "").replace(/_/g, " ").toLowerCase()
    .replace(/\b\w/g, c => c.toUpperCase());
}

function eventDescription(event) {
  const p = event.payload || {};
  const invoice = invoiceIdFromEvent(event);
  const readable = {
    PIPELINE_STARTED: `Invoice ${invoice} started invoice validation.`,
    PIPELINE_COMPLETED: `Invoice ${invoice} completed validation with ${(p.soft_failures || []).length} issue(s) before approval.`,
    PIPELINE_ABORTED: `Invoice ${invoice} stopped at ${p.aborted_at || "a critical stage"}.`,
    COMPLETENESS_PASSED: `Invoice ${invoice} has all required fields.`,
    COMPLETENESS_FAILED: `Invoice ${invoice} is missing ${(p.missing_fields || []).join(", ")}.`,
    OCR_HIGH_CONFIDENCE: `Invoice ${invoice} OCR confidence is above threshold.`,
    OCR_LOW_CONFIDENCE: `Invoice ${invoice} has low OCR confidence fields.`,
    VENDOR_VALIDATED: `Invoice ${invoice} vendor ${p.vendor_id || ""} is valid.`,
    VENDOR_NOT_FOUND: `Invoice ${invoice} vendor ${p.vendor_id || ""} was not found.`,
    VENDOR_BLACKLISTED: `Invoice ${invoice} vendor ${p.vendor_id || ""} is blacklisted.`,
    PO_MATCHED: `Invoice ${invoice} matched purchase order ${p.po_number || ""}.`,
    PO_MISMATCH: `Invoice ${invoice} purchase order amount does not match invoice amount.`,
    PO_NOT_FOUND: `Invoice ${invoice} purchase order ${p.po_number || ""} was not found.`,
    GRN_MATCHED: `Invoice ${invoice} matched goods receipt note.`,
    GRN_PARTIAL_MATCH: `Invoice ${invoice} partially matched goods receipt note.`,
    GRN_NOT_FOUND: `Invoice ${invoice} goods receipt note ${p.grn_number || ""} was not found.`,
    TAX_VALID: `Invoice ${invoice} tax amount is valid.`,
    TAX_MISMATCH: `Invoice ${invoice} tax mismatch detected. Difference: ${p.difference ?? "N/A"}.`,
    TAX_EXEMPTION_APPLIED: `Invoice ${invoice} tax exemption was applied.`,
    DUPLICATE_NOT_FOUND: `Invoice ${invoice} duplicate was not detected.`,
    DUPLICATE_DETECTED: `Invoice ${invoice} duplicate was detected.`,
    AI_CLARIFICATION_NEEDED: `Invoice ${invoice} needs review for ${(p.failed_stages || []).join(", ")}.`,
    AI_AUTO_APPROVED: p.message || `Invoice ${invoice} was auto-approved.`,
  };
  return readable[event.type] || `${titleCaseType(event.type)} for invoice ${invoice}.`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function searchableText(event) {
  return [
    event.id,
    event.type,
    event.severity,
    stageFromEvent(event),
    invoiceIdFromEvent(event),
    eventDescription(event),
    JSON.stringify(event.payload || {}),
  ].join(" ").toLowerCase();
}

function syncInvoiceFilter(events) {
  const select = document.getElementById("invoice-filter");
  const current = select.value;
  const invoices = [...new Set(events.map(invoiceIdFromEvent).filter(id => id !== "N/A"))].sort();
  select.innerHTML = `<option value="all">All invoices</option>` +
    invoices.map(id => `<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`).join("");
  select.value = invoices.includes(current) ? current : "all";
}

/* ── State ── */
let currentFilter = "all";
let validated     = new Set();

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  renderTable();
}

/* ── Render ── */
function renderTable() {
  const query  = document.getElementById("search").value.toLowerCase().trim();
  const events = window.EVENTS_DATA || [];
  syncInvoiceFilter(events);
  const invoiceFilter = document.getElementById("invoice-filter").value;

  const filtered = events.filter(e => {
    const matchInvoice = invoiceFilter === "all" || invoiceIdFromEvent(e) === invoiceFilter;
    const matchQ = !query || searchableText(e).includes(query);

    if (!matchInvoice || !matchQ) return false;

    if (currentFilter !== "all") return e.severity === currentFilter;
    return true;
  });

  // Update counts
  const counts = { CRITICAL:0, ERROR:0, WARNING:0, INFO:0 };
  events.forEach(e => { if (counts[e.severity] !== undefined) counts[e.severity]++; });
  document.getElementById("cnt-critical").textContent = counts.CRITICAL;
  document.getElementById("cnt-error").textContent    = counts.ERROR;
  document.getElementById("cnt-warning").textContent  = counts.WARNING;
  document.getElementById("cnt-info").textContent     = counts.INFO;

  const tbody = document.getElementById("tbody");

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">No events found.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const stage   = stageFromEvent(e);
    const invoice = invoiceIdFromEvent(e);
    const message = eventDescription(e);
    const extra   = extraFromPayload(e.payload);
    const ts      = fmtTimestamp(e.timestamp);
    const isVal   = validated.has(e.id);

    return `
      <tr>
        <td><span class="stage-pill">${escapeHtml(stage)}</span></td>
        <td>${escapeHtml(invoice)}</td>
        <td>${escapeHtml(message)}</td>
        <td><span class="badge badge-${escapeHtml(e.severity)}">${escapeHtml(e.severity.charAt(0)+e.severity.slice(1).toLowerCase())}</span></td>
        <td class="ts">${escapeHtml(ts)}</td>
        <td class="extra" title="${escapeHtml(extra)}">${escapeHtml(extra)}</td>
        <td>
          <button class="btn-details ${isVal ? 'viewed' : ''}"
                  onclick="openModal('${escapeHtml(e.id)}')">
            ${isVal ? 'Viewed' : 'Details'}
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

/* ── Modal ── */
function openModal(id) {
  const e = (window.EVENTS_DATA || []).find(ev => ev.id === id);
  if (!e) return;

  validated.add(id);
  renderTable();

  document.getElementById("modal-title").textContent = titleCaseType(e.type);
  const payloadJson = JSON.stringify(e.payload, null, 2);
  document.getElementById("modal-body").innerHTML = `
    <div class="modal-row"><span class="k">Event ID</span>     <span class="v" style="font-family:monospace">${escapeHtml(e.id)}</span></div>
    <div class="modal-row"><span class="k">Invoice</span>      <span class="v">${escapeHtml(invoiceIdFromEvent(e))}</span></div>
    <div class="modal-row"><span class="k">Type</span>         <span class="v">${escapeHtml(e.type)}</span></div>
    <div class="modal-row"><span class="k">Stage</span>        <span class="v">${escapeHtml(stageFromEvent(e))}</span></div>
    <div class="modal-row"><span class="k">Severity</span>     <span class="v"><span class="badge badge-${escapeHtml(e.severity)}">${escapeHtml(e.severity)}</span></span></div>
    <div class="modal-row"><span class="k">Timestamp</span>    <span class="v">${escapeHtml(fmtTimestamp(e.timestamp))}</span></div>
    <div class="modal-row"><span class="k">Description</span>  <span class="v">${escapeHtml(eventDescription(e))}</span></div>
    <div class="modal-row"><span class="k">Status</span>      <span class="v">${RESOLVED_TYPES.has(e.type) ? '✓ Resolved' : '⚠ Active'}</span></div>
    <div class="modal-row"><span class="k">Payload</span>     <span class="v"></span></div>
    <div class="modal-payload">${escapeHtml(payloadJson)}</div>
  `;
  document.getElementById("modal").classList.add("open");
}

function closeModal(e) {
  if (!e || e.target === document.getElementById("modal") || e.currentTarget === document.querySelector(".modal-close")) {
    document.getElementById("modal").classList.remove("open");
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("modal").classList.remove("open");
});

/* ── Refresh ── */
function refresh() {
  const btn = document.getElementById("btn-refresh");
  btn.classList.add("spinning");
  setTimeout(() => {
    btn.classList.remove("spinning");
    const now = new Date().toLocaleTimeString("en-GB", {hour12:false});
    document.getElementById("last-updated").textContent = `Updated ${now}`;
    renderTable();
  }, 600);
}

/* ── Boot ── */
function boot() {
  const now = new Date().toLocaleTimeString("en-GB", {hour12:false});
  document.getElementById("last-updated").textContent = `Updated ${now}`;
  renderTable();
}

boot();
</script>

<!-- Load real data generated by main.py (if served locally) -->
<script src="events_data.js" onerror="console.info('No events_data.js found — using inline demo data.')"></script>
<script>
  // Re-render after events_data.js loads (if it did)
  if (window.EVENTS_DATA) renderTable();
</script>
